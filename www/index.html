main{max-width:760px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:4px 0 12px}h2{font-size:16px;margin:0 0 10px}

function bday(){const L=[...S.bday].sort((a,c)=>bdIn(a)-bdIn(c));
 return `<h1>Aniversários</h1><div class="c"><input id="bd_n" placeholder="Nome" maxlength="40"><div class="row2"><input id="bd_d" inputmode="numeric" placeholder="Dia"><select id="bd_m">${MES.map((m,i)=>`<option value="${i+1}">${m}</option>`).join('')}</select></div><div class="row2"><input id="bd_y" inputmode="numeric" placeholder="Ano (opcional)"><input id="bd_h" type="time" value="09:00"></div><button class="b" onclick="addBd()">Salvar aniversário</button><p class="mu">Você recebe um aviso 5 dias antes e outro 1 dia antes, no horário escolhido.</p></div>
<div class="c"><h2>Próximos aniversários</h2>${L.map(b=>{const n=bdIn(b),age=b.year?new Date(Date.now()+n*864e5).getFullYear()-b.year:0;return `<div class="r"><div><b>${esc(b.name)}</b><div class="mu">${p2(b.day)}/${p2(b.month)}${age>0?' · faz '+age+' anos':''}</div></div><div><span class="${n<=5?'in':'mu'}">${n===0?'hoje':n===1?'amanhã':'em '+n+' dias'}</span> <button class="b s" onclick="rm('bday','${b.id}')">✕</button></div></div>`}).join('')||'<p class="mu">Nenhum aniversário salvo.</p>'}</div>`}
function addBd(){const name=V('bd_n').trim(),day=parseInt(V('bd_d')),month=+V('bd_m'),yr=V('bd_y').trim()?parseInt(V('bd_y')):0;
 if(!name)return msg('Escreva o nome');if(!(day>=1&&day<=[31,29,31,30,31,30,31,31,30,31,30,31][month-1]))return msg('Dia inválido para esse mês');if(yr&&!(yr>=1900&&yr<=new Date().getFullYear()))return msg('Ano inválido');
 S.bday.push({id:uid(),name,day,month,year:yr||0,time:V('bd_h')||'09:00'});save();msg('Aniversário salvo');permQuiet().then(()=>{lastLem='';schedAll()});draw()}

async function loadImg(f){
 if(window.createImageBitmap){try{const bm=await createImageBitmap(f,{imageOrientation:'from-image'});return{s:bm,w:bm.width,h:bm.height}}catch(e){try{const bm=await createImageBitmap(f);return{s:bm,w:bm.width,h:bm.height}}catch(e2){}}}
 const ti=src=>new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok({s:i,w:i.naturalWidth,h:i.naturalHeight});i.onerror=()=>no(new Error('img'));i.src=src});
 try{const u=URL.createObjectURL(f);try{return await ti(u)}finally{URL.revokeObjectURL(u)}}catch(e){}
 const du=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=()=>no(new Error('read'));r.readAsDataURL(f)});try{return await ti(du)}catch(e){}
 const buf=await f.arrayBuffer();for(const ty of ['image/jpeg','image/png','image/webp']){try{const u=URL.createObjectURL(new Blob([buf],{type:ty}));try{return await ti(u)}finally{URL.revokeObjectURL(u)}}catch(e){}}
 throw new Error('img')}
async function fotoPick(el){const f=el.files&&el.files[0];el.value='';if(!f)return;
 if(/heic|heif/i.test(f.type+f.name))return msg('Essa foto está em formato HEIC, que o app não abre. Escolha outra em JPG ou PNG, ou tire uma nova pela câmera.');
 try{const im=await loadImg(f),z=256,c=document.createElement('canvas');c.width=c.height=z;const q=Math.min(im.w,im.h);c.getContext('2d').drawImage(im.s,(im.w-q)/2,(im.h-q)/2,q,q,0,0,z,z);if(im.s.close)im.s.close();S.foto=c.toDataURL('image/jpeg',.82);save();msg('Foto atualizada');draw()}
 catch(e){msg('Não consegui abrir essa imagem ('+(f.type||'tipo desconhecido')+', '+Math.round(f.size/1024)+' KB). Tente outra foto em JPG ou PNG.')}}
function fotoDel(){S.foto='';save();msg('Foto removida');draw()}

 const ys=String(year),T=S.tx.filter(x=>x.date.startsWith(ys)),mi=Array(12).fill(0),mo=Array(12).fill(0);
 T.forEach(x=>(x.type==='in'?mi:mo)[+x.date.slice(5,7)-1]+=x.val);

<div class="chips"><button onclick="go('couple')"><span class="mu">Casal</span><br><b>${R(Math.abs(n))}</b><br><span class="mu">${n>=0?'a receber':'a pagar'}</span></button><button onclick="go('loans')"><span class="mu">Empréstimos</span><br><b>${R(Math.abs(loan))}</b><br><span class="mu">${loan>=0?'a receber':'a pagar'}</span></button><button onclick="go('rec')"><span class="mu">Fixos/mês</span><br><b>${R(fx)}</b></button></div>

<div class="c"><h2>Despesas: ${year} contra ${year-1}</h2><div class="ch">${MES.map((m,i)=>`<div><i style="height:${mp[i]/mx*100}%;background:var(--mu)" title="${R(mp[i])}"></i><i style="height:${mo[i]/mx*100}%;background:var(--out)" title="${R(mo[i])}"></i></div>`).join('')}</div><div class="lb">${MES.map(m=>`<span>${m}</span>`).join('')}</div><p class="mu">Cinza: ${year-1} · Laranja: ${year}</p></div>

function togRec(id){const r=S.rec.find(x=>x.id===id);r.off=!r.off;save();draw()}
function launch(id){const m=nowYM(),[y,mo]=m.split('-').map(Number),dim=new Date(y,mo,0).getDate();let k=0;
 S.rec.forEach(r=>{if((!id||r.id===id)&&r.last!==m&&!r.off){S.tx.push({id:uid(),type:r.type,val:r.val,desc:r.desc,date:m+'-'+p2(Math.min(r.day,dim)),cat:r.type==='in'?'Salário':'Contas',card:'',sp:null});r.last=m;k++}});
 save();msg(k?k+' lançamento(s) criado(s)':'Nada pendente neste mês');draw()}

function hl(){let L=sorted();if(hm)L=L.filter(x=>x.date.startsWith(hm));if(q)L=L.filter(x=>(x.desc+x.cat).toLowerCase().includes(q.toLowerCase()));
 const i=sum(L.filter(x=>x.type==='in').map(x=>x.val)),o=sum(L.filter(x=>x.type==='out').map(x=>x.val));
 return `<p class="mu">${L.length} lançamento(s) · receitas <b class="in">${R(i)}</b> · despesas <b class="out">${R(o)}</b></p>`+(L.map(txRow).join('')||'<p class="mu">Nada encontrado.</p>')}
function hist(){return `<h1>Histórico</h1><div class="c"><div class="row2"><input id="hm" type="month" value="${hm}" oninput="hm=this.value;$('#hl').innerHTML=hl()"><input id="hq" placeholder="Buscar" value="${esc(q)}" oninput="q=this.value;$('#hl').innerHTML=hl()"></div><div id="hl">${hl()}</div></div>`}
function cfg(){return `<h1>Ajustes</h1>${cfgTop()}<div class="c"><h2>Senha do app</h2>${lk?`<p class="mu">Senha ativa. Pedida ao abrir e após 30 s fora do app.</p><div class="row2"><button class="b s" onclick="lkStart('unlock')">Bloquear agora</button><button class="b s" onclick="lkStart('ver','chg')">Trocar senha</button></div><button class="b s" style="margin-top:8px" onclick="lkStart('ver','rm')">Remover senha</button>`:`<p class="mu">Proteja o app com uma senha numérica (4 a 8 dígitos). Após 5 erros, o app mostra a dica que você escrever.</p><button class="b" onclick="lkStart('new1')">Criar senha numérica</button>`}<p class="mu" style="margin-top:10px">A senha bloqueia a tela do app, mas não criptografa os dados guardados no aparelho.</p></div>
<div class="c"><h2>Enviar em PDF</h2><div class="row2"><input id="pf_m" type="month" value="${nowYM()}"><select id="pf_k"><option value="mes">Finanças do mês</option><option value="ano">Finanças do ano</option><option value="tudo">Tudo (mês + casal, empréstimos, fixos, tarefas, lembretes)</option></select></div><button class="b" onclick="pdfSave(V('pf_k'),V('pf_m'))">📄 Gerar PDF</button><p class="mu">No celular abre o menu de compartilhar (WhatsApp, e-mail, Drive).</p></div>
<div class="c"><h2>Backup</h2><p class="mu">Seus dados ficam só neste aparelho. Salve o arquivo de backup com frequência e guarde fora do celular (Drive, e-mail).</p><p class="mu">${lastBkTxt()}</p><button class="b" style="margin-bottom:10px" onclick="bkDown()">Salvar arquivo de backup</button><p class="mu">Restaurar de um arquivo de backup:</p><button class="b" onclick="$('#bkf').click()">Escolher arquivo de backup</button><input type="file" id="bkf" style="display:none" onchange="bkFile(this)"><p class="mu">Ou cole o texto do backup (gerado em "Gerar backup"):</p><textarea id="bk" rows="4" placeholder="Texto do backup"></textarea><div class="row2"><button class="b s" onclick="bkGen()">Gerar backup</button><button class="b" onclick="bkRes()">Restaurar</button></div></div>`}
function bkGen(){const e=$('#bk');e.value=JSON.stringify(S);e.select();try{document.execCommand('copy');msg('Backup gerado e copiado')}catch(x){msg('Backup gerado: copie o texto')}}
function parseBk(t){t=String(t||'').replace(/^\uFEFF/,'').trim();if(!t)throw new Error('O texto está vazio.');const a=t.indexOf('{'),b=t.lastIndexOf('}');if(a<0||b<a)throw new Error('Não achei um backup nesse texto.');
 let d;try{d=JSON.parse(t.slice(a,b+1))}catch(e){throw new Error('O backup está incompleto ou cortado. Copie a mensagem inteira, do começo ao fim.')}
 if(d&&!Array.isArray(d.tx)&&d.data&&Array.isArray(d.data.tx))d=d.data;
 if(!d||typeof d!=='object'||!['tx','dia','lem','bday','cards','loans','rec','ag'].some(k=>Array.isArray(d[k])))throw new Error('Esse conteúdo não parece um backup do GSC FINANÇAS.');return d}
function cleanBk(d){const ID=/[^\w-]/g,DT=/^\d{4}-\d{2}-\d{2}$/,YM=/^\d{4}-\d{2}$/,nm=v=>Number.isFinite(+v)?+v:0,sid=v=>String(v==null?'':v).replace(ID,'');
 const IDK=['id','gid','card','txid','pay','per','by','st','tipo','quem','first','freq','dir','rep','type'],NK=['val','total','paid','limit','due','day','month','year','n','imp','pct'];
 const fix=(k,v)=>{if(IDK.includes(k))return sid(v);if(k==='date')return DT.test(v)?v:today();if(k==='doneDate')return DT.test(v)?v:'';if(k==='time')return /^\d{2}:\d{2}$/.test(v)?v:'';if(k==='start')return YM.test(v)?v:'';if(NK.includes(k))return nm(v);
  if(k==='wd')return(Array.isArray(v)?v:[]).map(i=>+i).filter(i=>Number.isInteger(i)&&i>=0&&i<=6);if(k==='over')return Object.fromEntries(Object.entries(v&&typeof v==='object'?v:{}).filter(([m,w])=>YM.test(m)&&(w==='a'||w==='b')));
  if(k==='pagas')return Object.fromEntries(Object.entries(v&&typeof v==='object'?v:{}).filter(([m])=>YM.test(m)).map(([m,q])=>[m,{by:sid(q&&q.by),date:DT.test(q&&q.date)?q.date:today(),val:nm(q&&q.val),txid:sid(q&&q.txid)}]));
  if(k==='sp')return v&&typeof v==='object'?{by:sid(v.by),st:sid(v.st),pct:nm(v.pct)}:null;return v};
 const O={};['tx','cards','loans','rec','ag','dia','lem','bday','cc'].forEach(a=>{O[a]=(Array.isArray(d[a])?d[a]:[]).filter(x=>x&&typeof x==='object').map(x=>{const y={};for(const k in x)y[k]=fix(k,x[k]);return y})});
 O.inc={};if(d.inc&&typeof d.inc==='object')for(const k in d.inc)if(YM.test(k))O.inc[k]=nm(d.inc[k]);
 O.cp={n1:String((d.cp&&d.cp.n1)||''),n2:String((d.cp&&d.cp.n2)||'')};O.nome=String(d.nome||'');O.foto=/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+\/=]+$/.test(d.foto||'')?d.foto:'';return O}
function applyBk(d){d=cleanBk(d);U=JSON.stringify(S);S=Object.assign(NS(),{tx:d.tx||[],cards:d.cards||[],loans:d.loans||[],rec:d.rec||[],ag:d.ag||[],inc:d.inc||{},dia:d.dia||[],lem:d.lem||[],bday:d.bday||[],nome:d.nome||'',foto:d.foto||'',cc:d.cc||[],cp:d.cp||{n1:'',n2:''}});save();lastLem='';draw();
 msg('Backup restaurado: '+S.tx.length+' lançamentos, '+S.dia.length+' tarefas, '+S.lem.length+' lembretes, '+S.bday.length+' aniversários. Toque aqui para desfazer.')}
function bkRes(){try{applyBk(parseBk(V('bk')))}catch(e){msg(e.message||'Texto de backup inválido')}}

function draw(){S.dia=S.dia||[];S.lem=S.lem||[];S.bday=S.bday||[];S.cc=S.cc||[];S.cp=S.cp||{n1:'',n2:''};const sy=window.scrollY;navDraw();$('#app').innerHTML=bkBtn()+editBox()+diaEditBox()+bn2()+({home,mes,dia,cal,lem,bday,cfg,perfil,dash,add,cards,couple,ag:tk,loans,rec,hist})[tab]();const ek=(ed||'')+(edD||'');if(tab!==lastTab||(ek&&ek!==lastEk))window.scrollTo(0,0);else window.scrollTo(0,sy);lastTab=tab;lastEk=ek}
const TC=['Trabalho','Pessoal','Lembrete','Casa','Estudos'];let tf='p';
function tk(){const t=today(),A=S.ag.filter(a=>tf==='p'?!a.done:a.done).sort((a,b)=>((a.date||'9')+(a.time||'')).localeCompare((b.date||'9')+(b.time||'')));
 const G=tf==='p'?[['Atrasadas',A.filter(a=>a.date&&a.date<t)],['Hoje',A.filter(a=>a.date===t)],['Próximas',A.filter(a=>a.date>t)],['Sem data',A.filter(a=>!a.date)]]:[['Concluídas',A]];
 const row=a=>`<div class="r"><div><b>${a.done?'<s>'+esc(a.desc)+'</s>':esc(a.desc)}</b><div class="mu">${esc(a.cat||'')}${a.date?' · '+BR(a.date):''}${a.time?' às '+a.time:''}${a.note?' · '+esc(a.note):''}</div></div><div><button class="b s" onclick="tog('${a.id}')">${a.done?'↺':'✓'}</button> <button class="b s" onclick="rm('ag','${a.id}')">✕</button></div></div>`;
 return `<h1>Pendências</h1><div class="c"><input id="td" placeholder="O que preciso fazer ou lembrar?" maxlength="100"><div class="row2"><select id="tc">${TC.map(c=>`<option>${c}</option>`).join('')}</select><input id="tn" placeholder="Observação (opcional)" maxlength="100"></div><div class="row2"><input id="tdt" type="date" value="${t}"><input id="tth" type="time"></div><button class="b" onclick="addTk()">Adicionar</button></div>
<div class="row2" style="margin-bottom:10px"><button class="b${tf==='p'?'':' s'}" onclick="tf='p';draw()">Pendentes</button><button class="b${tf==='d'?'':' s'}" onclick="tf='d';draw()">Concluídas</button></div>
${G.filter(g=>g[1].length).map(g=>`<div class="c"><h2 class="${g[0]==='Atrasadas'?'bad':''}">${g[0]} (${g[1].length})</h2>${g[1].map(row).join('')}</div>`).join('')||'<p class="mu">Nada por aqui.</p>'}`}
function addTk(){const desc=V('td').trim();if(!desc)return msg('Escreva o que precisa fazer');S.ag.push({id:uid(),desc,cat:V('tc'),note:V('tn').trim(),date:V('tdt'),time:V('tth'),done:false});save();msg('Tarefa adicionada');draw()}
function tog(id){const a=S.ag.find(x=>x.id===id);a.done=!a.done;save();draw()}
function cloudQ(){}
async function bkDown(){const txt=JSON.stringify(Object.assign({_app:'financas-facil',_em:new Date().toISOString()},S)),name='financas-backup-'+today()+'.json';
 try{const P=window.Capacitor&&window.Capacitor.Plugins;
  if(P&&P.Filesystem&&P.Share){const r=await P.Filesystem.writeFile({path:name,data:txt,directory:'CACHE',encoding:'utf8'});await P.Share.share({title:'Backup GSC FINANÇAS',url:r.uri,dialogTitle:'Salvar backup'});try{localStorage.setItem('ffacil.lastbk',today())}catch(e){}msg('Backup pronto');return}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();a.remove();try{localStorage.setItem('ffacil.lastbk',today())}catch(e){}msg('Arquivo de backup baixado')}
 catch(e){if(!/cancel/i.test(String((e&&e.message)||e)))msg('Não foi possível salvar o arquivo')}}
function bkFile(el){const f=el.files&&el.files[0];el.value='';if(!f)return;const r=new FileReader();r.onload=()=>{try{applyBk(parseBk(r.result))}catch(e){msg(e.message||'Arquivo de backup inválido')}};r.onerror=()=>msg('Não foi possível ler o arquivo');r.readAsText(f)}
if(lk)lkStart('unlock');draw();schedAll();
</script></body></html>
