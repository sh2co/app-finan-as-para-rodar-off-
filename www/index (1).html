<script>
const $=s=>document.querySelector(s),K='ffacil.v1';
let S={tx:[],cards:[],loans:[],rec:[],ag:[],inc:{},dia:[],lem:[],bday:[],nome:'',foto:''},U=null,tab='home',mm='',sel='',ed=null,year=new Date().getFullYear(),hm='',q='';
try{const r=localStorage.getItem(K);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}cloudQ();schedQ()};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const R=v=>(+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const p2=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())};
const MES=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const CATS=['Alimentação','Moradia','Transporte','Saúde','Lazer','Educação','Compras','Contas','Salário','Outros'];
const V=id=>{const e=$('#'+id);return e?e.value:''},N=id=>parseFloat(V(id).replace(',','.')),sum=a=>a.reduce((s,x)=>s+x,0);
const BR=d=>d.split('-').reverse().join('/'),nowYM=()=>today().slice(0,7);
const PAY={pix:'Pix',cartao:'Cartão',debito:'Débito',dinheiro:'Dinheiro'},R0=v=>Math.round(v).toLocaleString('pt-BR'),pi=x=>{const m=x.desc.match(/\((\d+)\/(\d+)\)$/);return m?{i:+m[1],n:+m[2]}:null};
const addM=(ds,k)=>{const b=new Date(ds+'T12:00:00'),dy=b.getDate(),d=new Date(b.getFullYear(),b.getMonth()+k,1,12);d.setDate(Math.min(dy,new Date(d.getFullYear(),d.getMonth()+1,0).getDate()));return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())};
const msg=t=>{const e=$('#t');e.textContent=t;e.style.display='block';clearTimeout(msg.h);msg.h=setTimeout(()=>e.style.display='none',3000)};
$('#t').onclick=()=>{if(U){S=Object.assign({tx:[],cards:[],loans:[],rec:[],ag:[],inc:{}},JSON.parse(U));U=null;save();$('#t').style.display='none';draw()}};
function rm(k,id){U=JSON.stringify(S);S[k]=S[k].filter(x=>x.id!==id);save();msg('Removido · toque aqui para desfazer');draw()}
let navH=[],hok=false;
const go=t=>{if(t!==tab){navH.push(tab);try{history.pushState({app:1,d:navH.length},'');hok=true}catch(e){}}tab=t;ed=null;edD=null;draw()};
const cn=id=>(S.cards.find(c=>c.id===id)||{name:'Cartão'}).name;
const cardUsed=id=>sum(S.tx.filter(x=>x.card===id&&x.type==='out'&&x.date.slice(0,7)===nowYM()).map(x=>x.val));
const sh=x=>x.sp.by==='eu'?x.val*(x.sp.pct??50)/100:-x.val*(100-(x.sp.pct??50))/100;
const net=()=>sum(S.tx.filter(x=>x.sp&&x.sp.st==='p').map(sh));
const txRow=x=>`<div class="r"><div><b>${esc(x.desc)}</b><div class="mu">${BR(x.date)}${x.time?' às '+x.time:''} · ${esc(x.cat)}${x.pay?' · '+PAY[x.pay]:''}${x.card?' · '+esc(cn(x.card)):''}${x.sp?' · casal':''}</div></div><div><span class="${x.type}">${x.type==='in'?'+':'−'}${R(x.val)}</span> <button class="b s" onclick="ed='${x.id}';draw()">✎</button> <button class="b s" onclick="rm('tx','${x.id}')">✕</button></div></div>`;
const sorted=()=>[...S.tx].sort((a,b)=>b.date.localeCompare(a.date));

function cal(){if(!mm)mm=nowYM();
 const [y,mo]=mm.split('-').map(Number),dim=new Date(y,mo,0).getDate(),off=new Date(y,mo-1,1).getDay(),t=today(),by={};
 S.tx.filter(x=>x.date.startsWith(mm)).forEach(x=>(by[x.date]=by[x.date]||[]).push(x));
 let g='';for(let i=0;i<off;i++)g+='<i></i>';
 for(let d=1;d<=dim;d++){const ds=mm+'-'+p2(d),L=by[ds]||[],o=sum(L.filter(x=>x.type==='out').map(x=>x.val)),fin=L.some(x=>{const p=pi(x);return p&&p.n>1&&p.i===p.n});
  g+=`<button class="d${ds===sel?' sel':''}${ds===t?' tod':''}" onclick="sel='${ds}';draw()"><b>${d}</b>${o?`<span class="out">${R0(o)}</span>`:''}<span class="dts">${fin?'<i class="dt" style="background:var(--out)"></i>':''}${(remsOn(ds).length||bdsOn(ds).length)?'<i class="dt" style="background:var(--ac)"></i>':''}</span></button>`}
 const tot=sum(S.tx.filter(x=>x.date.startsWith(mm)&&x.type==='out').map(x=>x.val));let det='';
 if(sel.startsWith(mm)){const L=(by[sel]||[]).slice().sort((a,b)=>(a.time||'').localeCompare(b.time||'')),hh=new Date().toTimeString().slice(0,5);
  det=`<div class="c"><h2>${BR(sel)}</h2>${remsOn(sel).map(r=>`<div class="r"><span>${svg('bell',16)} ${esc(r.desc)}</span><b>${r.time}</b></div>`).join('')}${bdsOn(sel).map(b=>`<div class="r"><span>${svg('gift',16)} Aniversário de ${esc(b.name)}</span></div>`).join('')}<button class="b s" style="margin:6px 0" onclick="lemDate=sel;go('lem')">Lembrete neste dia</button>${L.map(x=>{const p=pi(x);return `<div class="r"><div><b>${esc(x.desc)}</b><div class="mu">${x.time||'--:--'} · ${PAY[x.pay]||'—'}${x.card?' ('+esc(cn(x.card))+')':''}${p&&p.n>1?' · termina em '+BR(addM(x.date,p.n-p.i))+(p.i===p.n?' 🏁 última parcela':''):''}</div></div><div><span class="${x.type}">${x.type==='in'?'+':'−'}${R(x.val)}</span> <button class="b s" onclick="ed='${x.id}';draw()">✎</button> <button class="b s" onclick="rm('tx','${x.id}')">✕</button></div></div>`}).join('')||'<p class="mu">Nenhum gasto neste dia.</p>'}</div>

 x.desc=d;x.per=V('de_p');x.imp=+V('de_i');if(V('de_d')!==x.date){x.date=V('de_d');if(x.done)x.doneDate=(x.doneDate&&x.doneDate>=x.date)?x.doneDate:x.date}

function mes(){if(!mm)mm=nowYM();
 const [y,mo]=mm.split('-').map(Number),base=+S.inc[mm]||0,T=S.tx.filter(x=>x.date.startsWith(mm)),ex=sum(T.filter(x=>x.type==='in').map(x=>x.val)),sp=sum(T.filter(x=>x.type==='out').map(x=>x.val)),tot=base+ex,left=tot-sp,p=tot>0?Math.min(100,sp/tot*100):(sp>0?100:0),cf=mm>=nowYM()?S.rec.filter(r=>r.type==='out'&&!r.off&&r.last!==mm):[],ca=[],com=sum(cf.map(r=>r.val)),free=left-com;
 let run=tot;const L=T.filter(x=>x.type==='out').sort((a,b)=>a.date.localeCompare(b.date)||0).map(x=>{run-=x.val;return{x,s:run}}).reverse();
 return `<h1>Finanças</h1><div class="r" style="margin-bottom:8px"><button class="b s" onclick="mgo(-1)">◀</button><b>${MES[mo-1]} de ${y}</b><button class="b s" onclick="mgo(1)">▶</button></div>
<div class="c"><div class="mu" style="margin-bottom:6px">Rendimento do mês (salário, mesada...)</div><div class="row2"><input id="inc" inputmode="decimal" placeholder="Ex.: 3500" value="${base||''}" style="margin:0"><button class="b" onclick="setInc()">Salvar</button></div>${ex?`<p class="mu">+ ${R(ex)} em receitas extras lançadas neste mês</p>`:''}</div>
<div class="c k hero"><small>Disponível</small><b style="font-size:28px" class="${left<0?'bad':'in'}">${R(left)}</b><div class="bar"><i style="width:${p}%;${p>=100?'background:var(--warn)':p>80?'background:var(--out)':''}"></i></div><p class="mu">Gasto ${R(sp)} de ${R(tot)}${tot>0?' ('+Math.round(sp/tot*100)+'%)':''}${left<0?' · passou do rendimento':''}</p></div>
${com>0?`<div class="c"><h2>Já comprometido neste mês</h2>${cf.map(r=>`<div class="r"><span>${esc(r.desc)} <span class="mu">· fixo dia ${r.day}</span></span><span class="out">${R(r.val)}</span></div>`).join('')}${ca.map(a=>`<div class="r"><span>${esc(a.desc)} <span class="mu">· ${BR(a.date)}</span></span><span class="out">${R(a.val)}</span></div>`).join('')}<div class="r"><b>Livre depois disso</b><b class="${free<0?'bad':'in'}">${R(free)}</b></div><p class="mu">Fixos ainda não lançados neste mês. As parcelas já entram nos gastos.</p></div>`:''}
<div class="c"><h2>Gastos do mês</h2><button class="b s" style="margin-bottom:8px" onclick="pdfSave('mes',mm)">📄 Enviar mês em PDF</button>${L.map(({x,s})=>`<div class="r"><div><b>${esc(x.desc)}</b><div class="mu">${BR(x.date)} · ${esc(x.cat)} · saldo: ${R(s)}</div></div><div><span class="out">−${R(x.val)}</span> <button class="b s" onclick="ed='${x.id}';draw()">✎</button> <button class="b s" onclick="rm('tx','${x.id}')">✕</button></div></div>`).join('')||'<p class="mu">Nenhum gasto neste mês.</p>'}</div>`}
function setInc(){const v=V('inc')===''?0:N('inc');if(!(v>=0))return msg('Valor inválido');S.inc[mm]=v;save();msg('Rendimento salvo');draw()}
function mgo(d){const [y,m]=mm.split('-').map(Number),n=new Date(y,m-1+d,1);mm=n.getFullYear()+'-'+p2(n.getMonth()+1);draw()}
function qAdd(){const val=N('qv'),desc=V('qd').trim();if(!(val>0))return msg('Informe um valor maior que zero');if(!desc)return msg('Informe uma descrição');
 S.tx.push({id:uid(),type:'out',val,desc,date:nowYM()===mm?today():mm+'-01',cat:V('qc'),card:'',sp:null});save();msg('Descontado do mês');draw()}
function dash(){
 const ys=String(year),T=S.tx.filter(x=>x.date.startsWith(ys)),mi=Array(12).fill(0),mo=Array(12).fill(0);
 T.forEach(x=>(x.type==='in'?mi:mo)[+x.date.slice(5,7)-1]+=x.val);
 const I=sum(mi),O=sum(mo),cm=new Date().getMonth(),cat={},mp=Array(12).fill(0);S.tx.forEach(x=>{if(x.type==='out'&&x.date.startsWith(String(year-1)))mp[+x.date.slice(5,7)-1]+=x.val});const OP=sum(mp),mx=Math.max(1,...mi,...mo,...mp);
 T.filter(x=>x.type==='out').forEach(x=>cat[x.cat]=(cat[x.cat]||0)+x.val);
 const cs=Object.entries(cat).sort((a,b)=>b[1]-a[1]),n=net();
 const loan=sum(S.loans.map(l=>(l.dir==='rec'?1:-1)*(l.total-l.paid))),fx=sum(S.rec.filter(r=>r.type==='out'&&!r.off).map(r=>r.val));
 const late=S.ag.filter(a=>!a.done&&a.date&&a.date<today()).length,ins=[];
 if(!T.length)ins.push('Nenhum lançamento em '+year+'. Comece adicionando um gasto.');
 else{
  if(cs[0])ins.push('Maior categoria: '+cs[0][0]+' ('+Math.round(cs[0][1]/O*100)+'% dos gastos).');
  if(I>0)ins.push(O<=I?'Você guardou '+Math.round((I-O)/I*100)+'% da renda no ano.':'Gastos acima das receitas em '+R(O-I)+'.');
  if(year===new Date().getFullYear()&&cm>0&&mo[cm-1]>0)ins.push('Gastos deste mês estão '+(mo[cm]>mo[cm-1]?'acima':'abaixo')+' do mês anterior ('+R(mo[cm])+' contra '+R(mo[cm-1])+').');
 }
 if(OP>0&&O>0)ins.push('Despesas de '+year+' estão '+Math.abs(Math.round((O/OP-1)*100))+'% '+(O>=OP?'acima':'abaixo')+' de '+(year-1)+'.');
 if(late)ins.push(late+' tarefa(s) atrasada(s) em Pendências.');
 const sm=mi[cm]-mo[cm];
 return `<h1>Dashboard</h1><div class="r" style="margin-bottom:8px"><button class="b s" onclick="year--;draw()">◀</button><b>${year}</b><button class="b s" onclick="year++;draw()">▶</button></div>
<div class="g"><div class="c k"><small>Receitas no ano</small><b class="in">${R(I)}</b></div><div class="c k"><small>Despesas no ano</small><b class="out">${R(O)}</b></div>
<div class="c k"><small>Saldo no ano</small><b class="${I-O<0?'bad':''}">${R(I-O)}</b></div><div class="c k"><small>Saldo de ${MES[cm]}</small><b class="${sm<0?'bad':''}">${R(sm)}</b><small>${T.length} lançamento(s) no ano</small></div></div>
<div class="chips"><button onclick="go('couple')"><span class="mu">Casal</span><br><b>${R(Math.abs(n))}</b><br><span class="mu">${n>=0?'a receber':'a pagar'}</span></button><button onclick="go('loans')"><span class="mu">Empréstimos</span><br><b>${R(Math.abs(loan))}</b><br><span class="mu">${loan>=0?'a receber':'a pagar'}</span></button><button onclick="go('rec')"><span class="mu">Fixos/mês</span><br><b>${R(fx)}</b></button></div>
<div class="c"><h2>Receitas e despesas por mês</h2><div class="ch">${MES.map((m,i)=>`<div><i style="height:${mi[i]/mx*100}%;background:var(--in)" title="${R(mi[i])}"></i><i style="height:${mo[i]/mx*100}%;background:var(--out)" title="${R(mo[i])}"></i></div>`).join('')}</div><div class="lb">${MES.map(m=>`<span>${m}</span>`).join('')}</div><p class="mu">Verde: receitas · Laranja: despesas</p></div>
<div class="c"><h2>Despesas: ${year} contra ${year-1}</h2><div class="ch">${MES.map((m,i)=>`<div><i style="height:${mp[i]/mx*100}%;background:var(--mu)" title="${R(mp[i])}"></i><i style="height:${mo[i]/mx*100}%;background:var(--out)" title="${R(mo[i])}"></i></div>`).join('')}</div><div class="lb">${MES.map(m=>`<span>${m}</span>`).join('')}</div><p class="mu">Cinza: ${year-1} · Laranja: ${year}</p></div>
<div class="c"><h2>Por categoria</h2>${cs.map(([k,v])=>`<div style="margin-bottom:8px"><div class="r" style="padding:0"><span>${esc(k)}</span><b>${R(v)}</b></div><div class="bar"><i style="width:${v/cs[0][1]*100}%"></i></div></div>`).join('')||'<p class="mu">Sem dados no período.</p>'}</div>
<div class="c"><h2>Insights</h2>${ins.map(i=>`<p style="margin:4px 0">• ${esc(i)}</p>`).join('')}</div>
<div class="row2"><button class="b" onclick="go('add')">Lançar gasto</button><button class="b s" onclick="go('hist')">Histórico</button></div>`}

function add(){return `<h1>Lançar</h1><div class="c"><select id="ty"><option value="out">Despesa</option><option value="in">Receita</option></select>
<div class="row2"><input id="v" inputmode="decimal" placeholder="Valor total (R$)"><input id="dt" type="date" value="${today()}"></div><input id="d" placeholder="Descrição" maxlength="80">
<div class="row2"><select id="ct">${CATS.map(c=>`<option>${c}</option>`).join('')}</select><select id="cd"><option value="">Sem cartão</option>${S.cards.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div>
<select id="sp"><option value="">Não dividir com parceiro(a)</option><option value="eu">Dividir · eu paguei</option><option value="par">Dividir · parceiro(a) pagou</option></select>
<div class="row2"><input id="pc" inputmode="decimal" placeholder="% do parceiro(a) (padrão 50)"><input id="np" inputmode="numeric" placeholder="Parcelas (padrão 1)"></div>
<button class="b" onclick="addTx()">Salvar</button></div><div class="c"><h2>Últimos lançamentos</h2>${sorted().slice(0,6).map(txRow).join('')||'<p class="mu">Nada lançado ainda.</p>'}</div>`}
function addTx(){const val=N('v'),desc=V('d').trim();
 if(!(val>0))return msg('Informe um valor maior que zero');if(!desc)return msg('Informe uma descrição');if(!V('dt'))return msg('Informe a data');
 const by=V('sp'),pct=V('pc')===''?50:N('pc'),n=V('np')===''?1:parseInt(V('np'));
 if(!(pct>=0&&pct<=100))return msg('Percentual entre 0 e 100');if(!(n>=1&&n<=60))return msg('Parcelas entre 1 e 60');
 const b=new Date(V('dt')+'T12:00:00'),dy=b.getDate(),g=uid();
 for(let i=0;i<n;i++){const d=new Date(b.getFullYear(),b.getMonth()+i,1,12);d.setDate(Math.min(dy,new Date(d.getFullYear(),d.getMonth()+1,0).getDate()));
  S.tx.push({id:uid(),type:V('ty'),val:n>1?Math.round(val/n*100)/100:val,desc:n>1?desc+' ('+(i+1)+'/'+n+')':desc,date:d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate()),cat:V('ct'),card:V('cd'),sp:by?{by,st:'p',pct}:null,gid:n>1?g:''})}
 save();msg(n>1?n+' parcelas lançadas':'Lançamento salvo');draw()}

function cards(){return `<h1>Cartões</h1><div class="c"><input id="cn" placeholder="Nome do cartão" maxlength="30"><div class="row2"><input id="cl" inputmode="decimal" placeholder="Limite (R$)"><input id="cv" inputmode="numeric" placeholder="Dia do vencimento"></div><button class="b" onclick="addCard()">Adicionar cartão</button></div>`+
 (S.cards.map(c=>{const u=cardUsed(c.id),p=c.limit?Math.min(100,u/c.limit*100):0;return `<div class="c"><div class="r"><b>${esc(c.name)}</b><button class="b s" onclick="rm('cards','${c.id}')">✕</button></div><div class="mu">Fatura do mês: ${R(u)}${c.limit?' de '+R(c.limit)+' · disponível '+R(c.limit-u):''}${c.due?' · vence dia '+c.due:''}</div>${c.limit?`<div class="bar"><i style="width:${p}%;${p>85?'background:var(--warn)':''}"></i></div>`:''}</div>`}).join('')||'<p class="mu">Nenhum cartão ainda. Os gastos feitos no cartão entram na fatura do mês.</p>')}
function addCard(){const name=V('cn').trim(),limit=N('cl')||0,due=parseInt(V('cv'))||0;
 if(!name)return msg('Informe o nome do cartão');if(limit<0)return msg('Limite inválido');if(due&&(due<1||due>31))return msg('Dia de vencimento entre 1 e 31');
 S.cards.push({id:uid(),name,limit,due});save();draw()}

function couple(){const n=net(),P=sorted().filter(x=>x.sp&&x.sp.st==='p');
 return `<h1>Casal</h1><div class="c k"><small>${n>=0?'Parceiro(a) deve a você':'Você deve ao parceiro(a)'}</small><b class="${n>=0?'in':'out'}">${R(Math.abs(n))}</b><p class="mu">Gastos divididos 50% / 50% pendentes de acerto. Marque a divisão ao lançar um gasto.</p>${P.length?'<button class="b" onclick="settle()">Quitar tudo</button>':''}</div>
<div class="c"><h2>Pendentes</h2>${P.map(x=>`<div class="r"><div><b>${esc(x.desc)}</b><div class="mu">${BR(x.date)} · ${x.sp.by==='eu'?'você pagou':'parceiro(a) pagou'} · parte do casal ${R(Math.abs(sh(x)))}</div></div><button class="b s" onclick="settle('${x.id}')">Quitar</button></div>`).join('')||'<p class="mu">Tudo acertado.</p>'}</div>`}
function settle(id){S.tx.forEach(x=>{if(x.sp&&x.sp.st==='p'&&(!id||x.id===id))x.sp.st='ok'});save();msg('Acerto registrado');draw()}

function ag(){const t=today(),L=[...S.ag].sort((a,b)=>(a.done-b.done)||a.date.localeCompare(b.date));
 return `<h1>Pendências</h1><div class="c"><input id="ad" placeholder="Conta ou compromisso" maxlength="60"><div class="row2"><input id="av" inputmode="decimal" placeholder="Valor (R$)"><input id="adt" type="date" value="${t}"></div><button class="b" onclick="addAg()">Agendar</button></div>
<div class="c">${L.map(a=>{const late=!a.done&&a.date<t,st=a.done?'Pago':late?'Atrasada':a.date===t?'Vence hoje':'Em '+Math.round((new Date(a.date)-new Date(t))/864e5)+' dia(s)';
 return `<div class="r"><div><b>${esc(a.desc)}</b><div class="mu ${late?'bad':''}">${BR(a.date)} · ${st} · ${R(a.val)}</div></div><div>${a.done?'':`<button class="b s" onclick="payAg('${a.id}')">Pagar</button> `}<button class="b s" onclick="rm('ag','${a.id}')">✕</button></div></div>`}).join('')||'<p class="mu">Nada agendado.</p>'}</div>`}
function addAg(){const val=N('av'),desc=V('ad').trim();if(!desc)return msg('Informe a descrição');if(!(val>0))return msg('Informe um valor maior que zero');if(!V('adt'))return msg('Informe a data');
 S.ag.push({id:uid(),desc,val,date:V('adt'),done:false});save();draw()}
function payAg(id){const a=S.ag.find(x=>x.id===id);a.done=true;S.tx.push({id:uid(),type:'out',val:a.val,desc:a.desc,date:today(),cat:'Contas',card:'',sp:null});save();msg('Pago e lançado nos gastos');draw()}

function loans(){return `<h1>Empréstimos</h1><div class="c"><input id="lw" placeholder="Pessoa ou instituição" maxlength="40"><div class="row2"><select id="ld"><option value="rec">Me devem</option><option value="dev">Eu devo</option></select><input id="lt" inputmode="decimal" placeholder="Valor total (R$)"></div><button class="b" onclick="addLoan()">Adicionar</button></div>`+
 (S.loans.map(l=>{const rest=l.total-l.paid,p=l.paid/l.total*100;return `<div class="c"><div class="r"><div><b>${esc(l.who)}</b><div class="mu">${l.dir==='rec'?'Me deve':'Eu devo'} · restam <b class="${l.dir==='rec'?'in':'out'}">${R(rest)}</b> de ${R(l.total)}</div></div><button class="b s" onclick="rm('loans','${l.id}')">✕</button></div><div class="bar"><i style="width:${p}%"></i></div>${rest>0?`<div class="row2" style="margin-top:8px"><input id="lp${l.id}" inputmode="decimal" placeholder="Pagamento (R$)" style="margin:0"><button class="b" onclick="payLoan('${l.id}')">Registrar</button></div>`:'<p class="mu">Quitado ✓</p>'}</div>`}).join('')||'<p class="mu">Nenhum empréstimo.</p>')}
function addLoan(){const who=V('lw').trim(),total=N('lt');if(!who)return msg('Informe quem');if(!(total>0))return msg('Informe um valor maior que zero');S.loans.push({id:uid(),who,dir:V('ld'),total,paid:0});save();draw()}
function payLoan(id){const l=S.loans.find(x=>x.id===id),v=N('lp'+id);if(!(v>0))return msg('Informe o valor do pagamento');l.paid=Math.min(l.total,l.paid+v);save();draw()}

function rec(){const m=nowYM();return `<h1>Fixos</h1><div class="c"><input id="rd" placeholder="Ex.: Aluguel, internet, salário" maxlength="60"><div class="row2"><input id="rv" inputmode="decimal" placeholder="Valor (R$)"><input id="rday" inputmode="numeric" placeholder="Dia do mês"></div><select id="rt"><option value="out">Despesa fixa</option><option value="in">Receita fixa</option></select><button class="b" onclick="addRec()">Adicionar</button></div>
<div class="c"><div class="r"><b>Despesas fixas por mês</b><b class="out">${R(sum(S.rec.filter(r=>r.type==='out'&&!r.off).map(r=>r.val)))}</b></div>${S.rec.length?'<button class="b" style="margin:8px 0" onclick="launch()">Lançar todos deste mês</button>':''}
${S.rec.map(r=>`<div class="r"><div><b>${esc(r.desc)}</b><div class="mu">Dia ${r.day} · ${r.type==='in'?'receita':'despesa'} · ${R(r.val)}</div></div><div>${r.off?'<span class="mu">pausado</span> ':r.last===m?'<span class="mu">lançado ✓</span> ':`<button class="b s" onclick="launch('${r.id}')">Lançar</button> `}<button class="b s" onclick="togRec('${r.id}')">${r.off?'Ativar':'Pausar'}</button> <button class="b s" onclick="rm('rec','${r.id}')">✕</button></div></div>`).join('')||'<p class="mu">Nenhum item fixo.</p>'}</div>`}
function addRec(){const val=N('rv'),day=parseInt(V('rday')),desc=V('rd').trim();if(!desc)return msg('Informe a descrição');if(!(val>0))return msg('Informe um valor maior que zero');if(!(day>=1&&day<=31))return msg('Dia do mês entre 1 e 31');
 S.rec.push({id:uid(),desc,val,day,type:V('rt'),last:''});save();draw()}
function togRec(id){const r=S.rec.find(x=>x.id===id);r.off=!r.off;save();draw()}
function launch(id){const m=nowYM(),[y,mo]=m.split('-').map(Number),dim=new Date(y,mo,0).getDate();let k=0;
 S.rec.forEach(r=>{if((!id||r.id===id)&&r.last!==m&&!r.off){S.tx.push({id:uid(),type:r.type,val:r.val,desc:r.desc,date:m+'-'+p2(Math.min(r.day,dim)),cat:r.type==='in'?'Salário':'Contas',card:'',sp:null});r.last=m;k++}});
 save();msg(k?k+' lançamento(s) criado(s)':'Nada pendente neste mês');draw()}

function hl(){let L=sorted();if(hm)L=L.filter(x=>x.date.startsWith(hm));if(q)L=L.filter(x=>(x.desc+x.cat).toLowerCase().includes(q.toLowerCase()));
 const i=sum(L.filter(x=>x.type==='in').map(x=>x.val)),o=sum(L.filter(x=>x.type==='out').map(x=>x.val));
 return `<p class="mu">${L.length} lançamento(s) · receitas <b class="in">${R(i)}</b> · despesas <b class="out">${R(o)}</b></p>`+(L.map(txRow).join('')||'<p class="mu">Nada encontrado.</p>')}
function hist(){return `<h1>Histórico</h1><div class="c"><div class="row2"><input id="hm" type="month" value="${hm}" oninput="hm=this.value;$('#hl').innerHTML=hl()"><input id="hq" placeholder="Buscar" value="${esc(q)}" oninput="q=this.value;$('#hl').innerHTML=hl()"></div><div id="hl">${hl()}</div></div>`}
function cfg(){return `<h1>Ajustes</h1>${cfgTop()}<div class="c"><h2>Senha do app</h2>${lk?`<p class="mu">Senha ativa. Pedida ao abrir e após 30 s fora do app.</p><div class="row2"><button class="b s" onclick="lkStart('unlock')">Bloquear agora</button><button class="b s" onclick="lkStart('ver','chg')">Trocar senha</button></div><button class="b s" style="margin-top:8px" onclick="lkStart('ver','rm')">Remover senha</button>`:`<p class="mu">Proteja o app com uma senha numérica (4 a 8 dígitos). Após 5 erros, o app mostra a dica que você escrever.</p><button class="b" onclick="lkStart('new1')">Criar senha numérica</button>`}<p class="mu" style="margin-top:10px">A senha bloqueia a tela do app, mas não criptografa os dados guardados no aparelho.</p></div>
<div class="c"><h2>Enviar em PDF</h2><div class="row2"><input id="pf_m" type="month" value="${nowYM()}"><select id="pf_k"><option value="mes">Finanças do mês</option><option value="ano">Finanças do ano</option><option value="tudo">Tudo (mês + casal, empréstimos, fixos, tarefas, lembretes)</option></select></div><button class="b" onclick="pdfSave(V('pf_k'),V('pf_m'))">📄 Gerar PDF</button><p class="mu">No celular abre o menu de compartilhar (WhatsApp, e-mail, Drive).</p></div>
<div class="c"><h2>Backup</h2><p class="mu">Seus dados ficam só neste aparelho. Salve o arquivo de backup com frequência e guarde fora do celular (Drive, e-mail).</p><p class="mu">${lastBkTxt()}</p><button class="b" style="margin-bottom:10px" onclick="bkDown()">Salvar arquivo de backup</button><p class="mu">Restaurar de um arquivo de backup:</p><input type="file" id="bkf" accept=".json,application/json" onchange="bkFile(this)"><p class="mu">Ou cole o texto do backup (gerado em "Gerar backup"):</p><textarea id="bk" rows="4" placeholder="Texto do backup"></textarea><div class="row2"><button class="b s" onclick="bkGen()">Gerar backup</button><button class="b" onclick="bkRes()">Restaurar</button></div></div>`}
function bkGen(){const e=$('#bk');e.value=JSON.stringify(S);e.select();try{document.execCommand('copy');msg('Backup gerado e copiado')}catch(x){msg('Backup gerado: copie o texto')}}
function bkRes(){try{const d=JSON.parse(V('bk'));if(!d||!Array.isArray(d.tx))throw 0;U=JSON.stringify(S);S={tx:d.tx||[],cards:d.cards||[],loans:d.loans||[],rec:d.rec||[],ag:d.ag||[],inc:d.inc||{},dia:d.dia||[],lem:d.lem||[],bday:d.bday||[],nome:d.nome||'',foto:d.foto||''};save();msg('Backup restaurado · toque aqui para desfazer');draw()}catch(e){msg('Texto de backup inválido')}}

const IC={mes:'💰',cal:'📅',dash:'📊',add:'➕',cards:'💳',couple:'👫',ag:'✅',loans:'🤝',rec:'🔁',hist:'🕑',dia:'📝',lem:'🔔'};
const TABS=[['mes','Meu mês'],['dia','Meu dia'],['cal','Calendário'],['lem','Lembretes'],['dash','Dashboard'],['add','Gastos'],['cards','Cartões'],['couple','Casal'],['ag','Agenda'],['loans','Empréstimos'],['rec','Fixos'],['hist','Histórico']];
function draw(){S.dia=S.dia||[];S.lem=S.lem||[];S.bday=S.bday||[];$('#nav').innerHTML=TABS.map(([k,l])=>`<button class="${k===tab?'on':''}" onclick="go('${k}')"><span class="ic">${ico(k)}</span>${l}</button>`).join('');
 navDraw();$('#app').innerHTML=bkBtn()+editBox()+diaEditBox()+bn2()+({home,mes,dia,cal,lem,bday,cfg,perfil,dash,add,cards,couple,ag:tk,loans,rec,hist})[tab]();window.scrollTo(0,0)}
const TC=['Trabalho','Pessoal','Lembrete','Casa','Estudos'];let tf='p';
function tk(){const t=today(),A=S.ag.filter(a=>tf==='p'?!a.done:a.done).sort((a,b)=>((a.date||'9')+(a.time||'')).localeCompare((b.date||'9')+(b.time||'')));
 const G=tf==='p'?[['Atrasadas',A.filter(a=>a.date&&a.date<t)],['Hoje',A.filter(a=>a.date===t)],['Próximas',A.filter(a=>a.date>t)],['Sem data',A.filter(a=>!a.date)]]:[['Concluídas',A]];
 const row=a=>`<div class="r"><div><b>${a.done?'<s>'+esc(a.desc)+'</s>':esc(a.desc)}</b><div class="mu">${esc(a.cat||'')}${a.date?' · '+BR(a.date):''}${a.time?' às '+a.time:''}${a.note?' · '+esc(a.note):''}</div></div><div><button class="b s" onclick="tog('${a.id}')">${a.done?'↺':'✓'}</button> <button class="b s" onclick="rm('ag','${a.id}')">✕</button></div></div>`;
 return `<h1>Pendências</h1><div class="c"><input id="td" placeholder="O que preciso fazer ou lembrar?" maxlength="100"><div class="row2"><select id="tc">${TC.map(c=>`<option>${c}</option>`).join('')}</select><input id="tn" placeholder="Observação (opcional)" maxlength="100"></div><div class="row2"><input id="tdt" type="date" value="${t}"><input id="tth" type="time"></div><button class="b" onclick="addTk()">Adicionar</button></div>
<div class="row2" style="margin-bottom:10px"><button class="b${tf==='p'?'':' s'}" onclick="tf='p';draw()">Pendentes</button><button class="b${tf==='d'?'':' s'}" onclick="tf='d';draw()">Concluídas</button></div>
${G.filter(g=>g[1].length).map(g=>`<div class="c"><h2 class="${g[0]==='Atrasadas'?'bad':''}">${g[0]} (${g[1].length})</h2>${g[1].map(row).join('')}</div>`).join('')||'<p class="mu">Nada por aqui.</p>'}`}
function addTk(){const desc=V('td').trim();if(!desc)return msg('Escreva o que precisa fazer');S.ag.push({id:uid(),desc,cat:V('tc'),note:V('tn').trim(),date:V('tdt'),time:V('tth'),done:false});save();msg('Tarefa adicionada');draw()}
function tog(id){const a=S.ag.find(x=>x.id===id);a.done=!a.done;save();draw()}
const NS=()=>({tx:[],cards:[],loans:[],rec:[],ag:[],inc:{},dia:[],lem:[],bday:[],nome:''});
function cloudQ(){}
async function bkDown(){const txt=JSON.stringify(Object.assign({_app:'financas-facil',_em:new Date().toISOString()},S)),name='financas-backup-'+today()+'.json';
 try{const P=window.Capacitor&&window.Capacitor.Plugins;
  if(P&&P.Filesystem&&P.Share){const r=await P.Filesystem.writeFile({path:name,data:txt,directory:'CACHE',encoding:'utf8'});await P.Share.share({title:'Backup Finanças Fácil',url:r.uri,dialogTitle:'Salvar backup'});try{localStorage.setItem('ffacil.lastbk',today())}catch(e){}msg('Backup pronto');return}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();a.remove();try{localStorage.setItem('ffacil.lastbk',today())}catch(e){}msg('Arquivo de backup baixado')}
 catch(e){if(!/cancel/i.test(String((e&&e.message)||e)))msg('Não foi possível salvar o arquivo')}}
function bkFile(el){const f=el.files&&el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||!Array.isArray(d.tx))throw 0;U=JSON.stringify(S);S=Object.assign(NS(),{tx:d.tx,cards:d.cards||[],loans:d.loans||[],rec:d.rec||[],ag:d.ag||[],inc:d.inc||{},dia:d.dia||[],lem:d.lem||[],bday:d.bday||[],nome:d.nome||'',foto:d.foto||''});save();msg('Backup restaurado do arquivo · toque aqui para desfazer');draw()}catch(e){msg('Arquivo de backup inválido')}};r.onerror=()=>msg('Não foi possível ler o arquivo');r.readAsText(f)}
if(lk)lkStart('unlock');draw();schedAll();
</script></body></html>
