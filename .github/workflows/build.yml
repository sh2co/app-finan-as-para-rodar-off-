name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Instalar dependencias
        run: npm install
      - name: Criar projeto Android
        run: npx cap add android
      - name: Som do alarme
        run: |
          mkdir -p android/app/src/main/res/raw
          if [ -f alarme.wav ]; then cp alarme.wav android/app/src/main/res/raw/alarme.wav; fi
      - name: Permissoes e versao
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n    <application#' android/app/src/main/AndroidManifest.xml
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
      - name: Sincronizar
        run: npx cap sync android
      - name: Usar chave fixa
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore
      - name: Fixar assinatura no projeto
        run: |
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  debug {
                      storeFile file('../../debug.keystore')
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }
          }
          GRADLE
      - name: Gerar APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Mostrar assinatura do APK
        run: |
          BT=$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)
          $BT/apksigner verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | grep -i "SHA-256" || true
      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: financas-facil-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
